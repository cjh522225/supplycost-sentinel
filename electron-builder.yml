appId: com.supplycost.sentinel
productName: 链价智控
copyright: Copyright © 2026 坏了坏了这下好了
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraFiles:
  - from: data
    to: data
  - from: config
    to: config
extraResources:
  - from: docs
    to: docs
  - from: scripts
    to: scripts
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: 链价智控-安装包-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: 链价智控
portable:
  artifactName: 链价智控-绿色版-${version}.${ext}
